# Monthly, grouped updates of the actions the workflows use, checked by CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    ignore:
      # @astrojs/check supports TypeScript 5 and 6 only
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The types follow the Node version the site is built with (site/.nvmrc)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      site:
        patterns: ["*"]
