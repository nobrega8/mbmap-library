body:
  - type: markdown
    attributes:
      value: |
        Show a tool, script or integration that reads or writes `.mbmap` files, or a project that uses the maps.
        When a tool is ready, it can be listed in [COMPATIBILITY.md](https://github.com/nobrega8/mbmap-library/blob/main/COMPATIBILITY.md) with a pull request.
  - type: input
    id: link
    attributes:
      label: Link
      placeholder: https://github.com/you/your-tool
  - type: textarea
    id: what
    attributes:
      label: What it is
      description: What it does with a map, and which parts of the format it supports so far.
    validations:
      required: true
