body:
  - type: markdown
    attributes:
      value: |
        Ideas for the format (SPEC.md), the tools in `tools/` or how the library is organised.
        To ask for a device map, use a [map request](https://github.com/nobrega8/mbmap-library/issues/new?template=2-map-request.yml) instead.
  - type: textarea
    id: problem
    attributes:
      label: What is missing or awkward today
      description: A real device or case helps, e.g. a register layout the format cannot describe.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would change
      description: For a format change, a short JSON example of how it would look in a map.
