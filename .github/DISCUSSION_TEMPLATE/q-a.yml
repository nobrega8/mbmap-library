body:
  - type: markdown
    attributes:
      value: |
        Ask about writing a map, reading a device with one, or the format itself.
        If a map is wrong, open an issue or a pull request instead, so the fix is not lost in a thread.
  - type: input
    id: map
    attributes:
      label: Map, if it is about one
      placeholder: maps/acme-meters/pm-200.mbmap.json
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What you are trying to do and what happens. Leave out serial numbers, IP addresses and other private installation data.
    validations:
      required: true
