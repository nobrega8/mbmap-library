name: Validate maps

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit is needed to compare map revisions.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/validate/run_tests.py
      - run: python tools/validate/validate.py maps examples
      - run: python tools/index/build_index.py --check
      - run: pip install jsonschema
      - run: python tools/migrate/test_migrate.py
      - run: python tools/revisions/test_check_revisions.py
      - run: python tools/export/test_export_ignition.py
      - name: Changed maps have a new revision
        if: github.event_name == 'pull_request'
        run: python tools/revisions/check_revisions.py ${{ github.event.pull_request.base.sha }}
